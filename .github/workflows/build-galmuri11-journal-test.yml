name: Build Galmuri11 journal test

on:
  push:
    branches:
      - tmp/galmuri11-journal-fix
    paths:
      - .github/workflows/build-galmuri11-journal-test.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download base patches and Galmuri BDFs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          curl -fL --retry 3 -o work/base128.zip \
            'https://github.com/munument1/-KR-Wizardry8/releases/download/v0.2.8/Wizardry8_KoreanPatch_1.28_JournalFix_v0.2.8.zip'
          curl -fL --retry 3 -o work/base124.zip \
            'https://github.com/munument1/-KR-Wizardry8/releases/download/0.2.8%281.24%29/Wizardry8_KoreanPatch_1.24_JournalFix_v0.2.8.zip'
          curl -fL --retry 3 -o work/Galmuri9.bdf \
            'https://raw.githubusercontent.com/quiple/galmuri/main/dist/Galmuri9.bdf'
          curl -fL --retry 3 -o work/Galmuri11.bdf \
            'https://raw.githubusercontent.com/quiple/galmuri/main/dist/Galmuri11.bdf'
          ls -lh work

      - name: Build and validate test patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, struct, hashlib, shutil, collections, json

          ROOT = Path("work")
          OUT = Path("out")
          OUT.mkdir(exist_ok=True)
          HANGUL_START = 154
          HANGUL_COUNT = 1196
          HANGUL_END = HANGUL_START + HANGUL_COUNT
          INK = 44

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def extract_zip(src, dst):
              if dst.exists():
                  shutil.rmtree(dst)
              dst.mkdir(parents=True)
              with zipfile.ZipFile(src, "r") as zf:
                  zf.extractall(dst)

          def parse_bdf(path):
              lines = Path(path).read_text("ascii", errors="strict").splitlines()
              glyphs = {}
              props = {}
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith("FONTBOUNDINGBOX "):
                      props["FONTBOUNDINGBOX"] = tuple(map(int, line.split()[1:5]))
                  elif line.startswith("FONT_ASCENT "):
                      props["FONT_ASCENT"] = int(line.split()[1])
                  elif line.startswith("FONT_DESCENT "):
                      props["FONT_DESCENT"] = int(line.split()[1])
                  elif line.startswith("STARTCHAR "):
                      enc = None
                      bbx = None
                      bitmap = None
                      i += 1
                      while i < len(lines) and not lines[i].startswith("ENDCHAR"):
                          s = lines[i]
                          if s.startswith("ENCODING "):
                              enc = int(s.split()[1])
                          elif s.startswith("BBX "):
                              bbx = tuple(map(int, s.split()[1:5]))
                          elif s == "BITMAP":
                              if bbx is None:
                                  raise RuntimeError("BITMAP before BBX")
                              w, h, xoff, yoff = bbx
                              bitmap = []
                              for r in range(h):
                                  hx = lines[i + 1 + r].strip()
                                  total_bits = len(hx) * 4
                                  val = int(hx, 16) if hx else 0
                                  row = []
                                  for x in range(w):
                                      bit = (val >> (total_bits - 1 - x)) & 1
                                      row.append(bit)
                                  bitmap.append(row)
                              i += h
                          i += 1
                      if enc is not None and bbx is not None and bitmap is not None:
                          glyphs[enc] = (bbx, bitmap)
                      continue
                  i += 1
              return props, glyphs

          def parse_sti(raw):
              if raw[:4] != b"STCI":
                  raise RuntimeError("journal font is not STCI")
              n = struct.unpack_from("<H", raw, 28)[0]
              if n != 3299:
                  raise RuntimeError(f"unexpected frame count {n}")
              meta_off = 64 + 256 * 3
              data_start = meta_off + n * 16
              recs = []
              for idx in range(n):
                  recs.append(list(struct.unpack_from("<IIhhHH", raw, meta_off + idx * 16)))
              return n, meta_off, data_start, recs

          def frame_comp(raw, parsed, idx):
              _, _, data_start, recs = parsed
              off, length = recs[idx][0], recs[idx][1]
              return raw[data_start + off:data_start + off + length]

          def decode_frame(raw, parsed, idx):
              _, _, _, recs = parsed
              comp = frame_comp(raw, parsed, idx)
              _, _, _, _, h, w = recs[idx]
              rows = []
              p = 0
              for y in range(h):
                  row = []
                  while True:
                      if p >= len(comp):
                          raise RuntimeError(f"frame {idx} truncated at row {y}")
                      cmd = comp[p]
                      p += 1
                      if cmd == 0:
                          break
                      count = cmd & 0x7f
                      if count == 0:
                          raise RuntimeError(f"frame {idx} invalid zero run")
                      if cmd & 0x80:
                          row.extend([0] * count)
                      else:
                          row.extend(comp[p:p + count])
                          p += count
                  if len(row) != w:
                      raise RuntimeError(f"frame {idx} row {y}: width {len(row)} != {w}")
                  rows.append(row)
              if p != len(comp):
                  raise RuntimeError(f"frame {idx}: trailing ETRLE bytes {len(comp)-p}")
              return rows

          def etrle_encode(rows):
              out = bytearray()
              for row in rows:
                  x = 0
                  w = len(row)
                  while x < w:
                      if row[x] == 0:
                          j = x
                          while j < w and row[j] == 0 and j - x < 127:
                              j += 1
                          out.append(0x80 | (j - x))
                          x = j
                      else:
                          j = x
                          while j < w and row[j] != 0 and j - x < 127:
                              j += 1
                          out.append(j - x)
                          out.extend(row[x:j])
                          x = j
                  out.append(0)
              return bytes(out)

          def rebuild_sti(raw, replacements):
              n, meta_off, data_start, recs = parse_sti(raw)
              comps = []
              for idx, rec in enumerate(recs):
                  if idx in replacements:
                      comp = etrle_encode(replacements[idx])
                  else:
                      comp = frame_comp(raw, (n, meta_off, data_start, recs), idx)
                  comps.append(comp)
              new = bytearray(raw[:data_start])
              data_off = 0
              for idx, (rec, comp) in enumerate(zip(recs, comps)):
                  rec[0] = data_off
                  rec[1] = len(comp)
                  struct.pack_into("<IIhhHH", new, meta_off + idx * 16, *rec)
                  data_off += len(comp)
              new.extend(b"".join(comps))
              struct.pack_into("<I", new, 8, data_off)
              return bytes(new)

          def glyph_coords(glyph):
              (w, h, xoff, yoff), bitmap = glyph
              pts = set()
              for r, row in enumerate(bitmap):
                  y_bdf = yoff + h - 1 - r
                  for c, bit in enumerate(row):
                      if bit:
                          pts.add((xoff + c, y_bdf))
              return pts

          def sprite_foreground_coords(raw, parsed, idx):
              rows = decode_frame(raw, parsed, idx)
              return {(x, y) for y, row in enumerate(rows) for x, v in enumerate(row) if v == INK}

          def find_hangul_map(exe):
              for off in range(0, len(exe) - HANGUL_COUNT * 2, 2):
                  if exe[off:off+2] != b"\x00\xac":
                      continue
                  vals = list(struct.unpack_from("<" + "H" * HANGUL_COUNT, exe, off))
                  if (all(0xAC00 <= cp <= 0xD7A3 for cp in vals)
                          and all(vals[i] < vals[i+1] for i in range(len(vals)-1))):
                      return off, vals
              raise RuntimeError("1,196-glyph Hangul Unicode map not found")

          def infer_galmuri9_alignment(font_raw, parsed, cps, g9):
              actual = [sprite_foreground_coords(font_raw, parsed, HANGUL_START + i)
                        for i in range(HANGUL_COUNT)]
              best = None
              for x_origin in range(-3, 6):
                  for baseline in range(8, 25):
                      exact = 0
                      pixel_delta = 0
                      present = 0
                      for i, cp in enumerate(cps):
                          glyph = g9.get(cp)
                          if glyph is None:
                              continue
                          present += 1
                          predicted = {(x_origin + x, baseline - y) for x, y in glyph_coords(glyph)}
                          if predicted == actual[i]:
                              exact += 1
                          pixel_delta += len(predicted ^ actual[i])
                      score = (exact, -pixel_delta)
                      if best is None or score > best[0]:
                          best = (score, x_origin, baseline, present, pixel_delta)
              return best

          def build_galmuri11_rows(cps, g11, x_origin, baseline):
              repl = {}
              missing = []
              clipped = []
              for i, cp in enumerate(cps):
                  glyph = g11.get(cp)
                  if glyph is None:
                      missing.append(cp)
                      continue
                  rows = [[0] * 13 for _ in range(28)]
                  for x, y in glyph_coords(glyph):
                      sx = x_origin + x
                      sy = baseline - y
                      if not (0 <= sx < 13 and 0 <= sy < 28):
                          clipped.append((cp, sx, sy))
                          continue
                      rows[sy][sx] = INK
                  repl[HANGUL_START + i] = rows
              if missing:
                  raise RuntimeError(f"Galmuri11 missing {len(missing)} mapped Hangul glyphs")
              if clipped:
                  preview = ", ".join(f"U+{cp:04X}@{x},{y}" for cp,x,y in clipped[:10])
                  raise RuntimeError(f"Galmuri11 clipped {len(clipped)} pixels: {preview}")
              return repl

          def replace_mook_with_mukeu(data):
              raw = bytearray(data)
              pat = "Mook".encode("utf-16le")
              repl = "무크".encode("utf-16le")
              positions = []
              start = 0
              while True:
                  pos = bytes(raw).find(pat, start)
                  if pos < 0:
                      break
                  if pos % 2 == 0:
                      s = pos
                      while s >= 2 and raw[s-2:s] != b"\x00\x00":
                          s -= 2
                      e = pos
                      while e + 1 < len(raw) and raw[e:e+2] != b"\x00\x00":
                          e += 2
                      segment = bytes(raw[s:e])
                      text = segment.decode("utf-16le", errors="ignore")
                      if any(0xAC00 <= ord(ch) <= 0xD7A3 for ch in text):
                          positions.append(pos)
                  start = pos + 2
              if len(positions) != 17:
                  raise RuntimeError(f"expected 17 Korean-journal Mook occurrences, found {len(positions)}")
              for pos in reversed(positions):
                  e = pos
                  while e + 1 < len(raw) and raw[e:e+2] != b"\x00\x00":
                      e += 2
                  tail = bytes(raw[pos + len(pat):e])
                  new_text = repl + tail
                  old_len = e - pos
                  if len(new_text) > old_len:
                      raise RuntimeError("replacement grew beyond field")
                  raw[pos:pos+len(new_text)] = new_text
                  raw[pos+len(new_text):e] = b"\x00" * (old_len - len(new_text))
              remaining = []
              bb = bytes(raw)
              start = 0
              while True:
                  pos = bb.find(pat, start)
                  if pos < 0:
                      break
                  if pos % 2 == 0:
                      s = pos
                      while s >= 2 and bb[s-2:s] != b"\x00\x00":
                          s -= 2
                      e = pos
                      while e + 1 < len(bb) and bb[e:e+2] != b"\x00\x00":
                          e += 2
                      text = bb[s:e].decode("utf-16le", errors="ignore")
                      if any(0xAC00 <= ord(ch) <= 0xD7A3 for ch in text):
                          remaining.append(pos)
                  start = pos + 2
              if remaining:
                  raise RuntimeError(f"Korean-context Mook remains at {remaining[:10]}")
              if bb.count(repl) != 17:
                  raise RuntimeError(f"expected 17 '무크' UTF-16LE occurrences, got {bb.count(repl)}")
              return bb, positions

          def regenerate_checksums(root):
              checksum_path = root / "SHA256SUMS.txt"
              lines = []
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p == checksum_path:
                      continue
                  rel = p.relative_to(root).as_posix()
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
              checksum_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def zip_tree(root, outzip):
              with zipfile.ZipFile(outzip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(root.rglob("*")):
                      if p.is_file():
                          zf.write(p, p.relative_to(root).as_posix())

          p128 = ROOT / "p128"
          p124 = ROOT / "p124"
          extract_zip(ROOT / "base128.zip", p128)
          extract_zip(ROOT / "base124.zip", p124)

          f128 = (p128 / "Data/JOURNAL/journal_font.sti").read_bytes()
          f124 = (p124 / "Data/JOURNAL/journal_font.sti").read_bytes()
          if f128 != f124:
              raise RuntimeError("v0.2.8 1.24/1.28 journal fonts differ unexpectedly")
          fact128 = (p128 / "Data/DATABASES/FACT.DBS").read_bytes()
          fact124 = (p124 / "Data/DATABASES/FACT.DBS").read_bytes()
          if fact128 != fact124:
              raise RuntimeError("v0.2.8 1.24/1.28 FACT.DBS differ unexpectedly")

          exe = (p128 / "Wiz8_v128.exe").read_bytes()
          map_off, cps = find_hangul_map(exe)
          print(f"Hangul map: offset=0x{map_off:X}, count={len(cps)}, first={chr(cps[0])}, last={chr(cps[-1])}")

          props9, g9 = parse_bdf(ROOT / "Galmuri9.bdf")
          props11, g11 = parse_bdf(ROOT / "Galmuri11.bdf")
          print("Galmuri9 props:", props9)
          print("Galmuri11 props:", props11)

          parsed = parse_sti(f128)
          best = infer_galmuri9_alignment(f128, parsed, cps, g9)
          (exact, neg_delta), x_origin, baseline, present, pixel_delta = best
          print(f"Galmuri9 alignment best: x_origin={x_origin}, baseline={baseline}, exact={exact}/{present}, pixel_delta={pixel_delta}")
          if exact < 1000:
              raise RuntimeError("Could not reliably infer Galmuri9 placement from current journal font")

          replacements = build_galmuri11_rows(cps, g11, x_origin, baseline)
          new_font = rebuild_sti(f128, replacements)
          new_parsed = parse_sti(new_font)

          for idx in range(3299):
              decode_frame(new_font, new_parsed, idx)
          changed = [idx for idx in range(3299)
                     if frame_comp(new_font, new_parsed, idx) != frame_comp(f128, parsed, idx)]
          if changed != list(range(HANGUL_START, HANGUL_END)):
              raise RuntimeError(f"unexpected changed frame set: count={len(changed)} first={changed[:5]} last={changed[-5:]}")
          for idx in range(HANGUL_START, HANGUL_END):
              rows = decode_frame(new_font, new_parsed, idx)
              used = {v for row in rows for v in row if v}
              if used - {INK}:
                  raise RuntimeError(f"frame {idx} contains non-ink palette indices {used}")
          for idx in list(range(HANGUL_START)) + list(range(HANGUL_END, 3299)):
              if frame_comp(new_font, new_parsed, idx) != frame_comp(f128, parsed, idx):
                  raise RuntimeError(f"non-Hangul frame {idx} changed")
          if new_font[64:64+768] != f128[64:64+768]:
              raise RuntimeError("palette changed")
          _,_,_,old_recs = parsed
          _,_,_,new_recs = new_parsed
          for i in range(3299):
              if old_recs[i][2:] != new_recs[i][2:]:
                  raise RuntimeError(f"frame geometry changed at {i}")

          new_fact, mook_positions = replace_mook_with_mukeu(fact128)
          print("Mook->무크 journal occurrences:", len(mook_positions), [hex(x) for x in mook_positions])

          report = {
              "base": "v0.2.8",
              "galmuri_source": "quiple/galmuri main (downloaded at build time)",
              "hangul_map_offset": hex(map_off),
              "hangul_frames": [HANGUL_START, HANGUL_END - 1],
              "hangul_count": HANGUL_COUNT,
              "g9_alignment_probe": {
                  "x_origin": x_origin,
                  "baseline": baseline,
                  "exact_matches": exact,
                  "present": present,
                  "pixel_delta": pixel_delta,
                  "props": props9,
              },
              "g11_props": props11,
              "palette_index": INK,
              "shadow": False,
              "changed_font_frames": len(changed),
              "unchanged_nonhangul_frames": 3299 - len(changed),
              "mook_to_mukeu_occurrences": len(mook_positions),
              "journal_font_sha256": sha256_bytes(new_font),
              "fact_sha256": sha256_bytes(new_fact),
          }

          notes = """Wizardry 8 한국어 패치 v0.2.9-test1 - 저널 갈무리11/무크 테스트
==========================================================

변경 내용
---------
- 저널 한글 1,196개 글리프를 갈무리11 픽셀 글리프로 교체했습니다.
- 저널 한글 글리프의 1px 그림자를 제거했습니다.
- 저널 한글은 기존 저널 팔레트의 단일 잉크 인덱스(44)만 사용하도록 해
  회색/비활성 항목에서 그림자 팔레트 인덱스가 섞이던 경로를 제거했습니다.
- 한국어 저널 문맥의 Mook 표기 17회(16개 저널 슬롯)를 '무크'로 수정했습니다.
- 비한글 2,103개 저널 글리프와 나머지 게임 데이터는 v0.2.8을 그대로 유지했습니다.

검증
---------
- journal_font.sti 프레임 3,299개 ETRLE 전수 재해독 통과
- 한글 프레임 154-1349(1,196개)만 변경
- 비한글 2,103개 프레임 압축 데이터 바이트 동일
- 한글 글리프 픽셀 팔레트 인덱스 44 단일 사용, 그림자 인덱스 15 사용 0건
- 1.24 / 1.28의 FACT.DBS와 journal_font.sti 동일
- 실제 게임 화면 검증 전 테스트 빌드입니다.
"""

          for root, label in [(p128, "1.28"), (p124, "1.24")]:
              (root / "Data/JOURNAL/journal_font.sti").write_bytes(new_font)
              (root / "Data/DATABASES/FACT.DBS").write_bytes(new_fact)
              (root / "README_v0.2.9-test1.txt").write_text(notes, encoding="utf-8-sig")
              regenerate_checksums(root)
              outzip = OUT / f"Wizardry8_KoreanPatch_{label}_JournalGalmuri11_v0.2.9-test1.zip"
              zip_tree(root, outzip)
              print(label, outzip, outzip.stat().st_size, hashlib.sha256(outzip.read_bytes()).hexdigest())

          if (p128/"Data/JOURNAL/journal_font.sti").read_bytes() != (p124/"Data/JOURNAL/journal_font.sti").read_bytes():
              raise RuntimeError("final journal fonts differ")
          if (p128/"Data/DATABASES/FACT.DBS").read_bytes() != (p124/"Data/DATABASES/FACT.DBS").read_bytes():
              raise RuntimeError("final FACT.DBS differ")

          (OUT / "validation.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload test patches
        uses: actions/upload-artifact@v4
        with:
          name: wizardry8-galmuri11-journal-v0.2.9-test1
          path: out/*
          if-no-files-found: error
          retention-days: 14
