name: Publish v0.2.8 releases

on:
  push:
    branches:
      - release-v0.2.8-publisher
    paths:
      - release-payload/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download v0.2.7 bases
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o old-128.zip 'https://github.com/munument1/-KR-Wizardry8/releases/download/v0.2.7/Wizardry8_KoreanPatch_1.28_TopicFix_v0.2.7.zip'
          curl -L --fail --retry 3 -o old-124.zip 'https://github.com/munument1/-KR-Wizardry8/releases/download/0.2.7%281.24%29/Wizardry8_KoreanPatch_1.24_TopicFix_v0.2.7.zip'

      - name: Reconstruct exact v0.2.8 ZIPs
        shell: bash
        run: |
          set -euo pipefail
          cat release-payload/patch.part* > patch.b64
          python3 - <<'PY'
          import base64, hashlib, lzma, pickle, struct, zipfile

          payload = pickle.loads(lzma.decompress(base64.b64decode(open('patch.b64','rb').read())))

          def compressed_map(path):
              raw = open(path, 'rb').read()
              zf = zipfile.ZipFile(path)
              out = {}
              for info in zf.infolist():
                  off = info.header_offset
                  if raw[off:off+4] != b'PK\x03\x04':
                      raise RuntimeError(f'bad local header: {info.filename}')
                  fnlen, extralen = struct.unpack_from('<HH', raw, off + 26)
                  start = off + 30 + fnlen + extralen
                  out[info.filename] = raw[start:start + info.compress_size]
              return out

          def rebuild(key, old_path, out_path):
              entries, suffix, expected_sha, expected_size = payload[key]
              old = compressed_map(old_path)
              chunks = []
              mismatches = []
              for name, header, comp_sha, comp_size, literal in entries:
                  if literal is None:
                      comp = old.get(name)
                      if comp is None:
                          mismatches.append((name, 'missing'))
                          continue
                      if len(comp) != comp_size or hashlib.sha256(comp).digest() != comp_sha:
                          mismatches.append((name, f'compressed data differs old={len(comp)} target={comp_size}'))
                          continue
                  else:
                      comp = literal
                  chunks.append(header)
                  chunks.append(comp)
              if mismatches:
                  print(f'{key}: {len(mismatches)} reusable-entry mismatch(es)')
                  for item in mismatches[:50]:
                      print('MISMATCH', item)
                  raise SystemExit(2)
              chunks.append(suffix)
              result = b''.join(chunks)
              got = hashlib.sha256(result).digest()
              if len(result) != expected_size or got != expected_sha:
                  raise SystemExit(f'{key}: target reconstruction hash mismatch: size={len(result)}, sha256={hashlib.sha256(result).hexdigest()}')
              open(out_path, 'wb').write(result)
              print(f'{key}: exact target verified {hashlib.sha256(result).hexdigest()}')

          rebuild('124', 'old-124.zip', 'Wizardry8_KoreanPatch_1.24_JournalFix_v0.2.8.zip')
          rebuild('128', 'old-128.zip', 'Wizardry8_KoreanPatch_1.28_JournalFix_v0.2.8.zip')
          PY

          echo '34D876B606AAD2F6610B20701DE45A35600A306F07F4F995D96BE3C1B8ED7DC4  Wizardry8_KoreanPatch_1.24_JournalFix_v0.2.8.zip' | sha256sum -c -
          echo '7D2A892DB90CE75E51C6B122A78DFBFDF4A2D55A70939E2DD9DD07C379DDF254  Wizardry8_KoreanPatch_1.28_JournalFix_v0.2.8.zip' | sha256sum -c -

      - name: Prepare release notes
        shell: bash
        run: |
          cat > notes-124.md <<'EOF'
          # Wizardry 8 한국어 패치 v0.2.8 — 1.24

          Wizardry 8 **1.24**용 저널 표기/글꼴 수정 릴리스입니다.

          ## 변경 내용

          - 저널에서 종족/고유명사 `Mook`가 `묵`으로 번역되던 16개 슬롯을 `Mook`로 통일했습니다.
          - `FACT.DBS`에서 Mook 관련 저널 필드만 변경했고, 저널 필드 외 데이터 변경은 0건입니다.
          - v0.2.7에서 갈무리9 교체 대상에서 빠져 있던 `Data/JOURNAL/journal_font.sti`를 수정했습니다.
          - 저널 한글 1,196개 글리프를 갈무리9 기반 픽셀 형태로 교체하고 라틴 문자 기준선에 맞춰 재배치했습니다.
          - 비한글 2,103개 글리프의 ETRLE 압축 데이터는 v0.2.7과 동일하게 유지했습니다.

          ## 검증

          - Mook 관련 저널 항목 전체에서 `묵` 잔존 0건
          - `FACT.DBS` 저널 필드 외 변경 0건
          - `journal_font.sti` 3,299개 프레임 전체 ETRLE 재해독 통과
          - 1.24 / 1.28의 수정 `FACT.DBS`, `journal_font.sti` 바이트 단위 동일 확인
          - ZIP CRC 및 SHA-256 검증 완료

          ## 다운로드

          `Wizardry8_KoreanPatch_1.24_JournalFix_v0.2.8.zip`

          SHA-256: `34D876B606AAD2F6610B20701DE45A35600A306F07F4F995D96BE3C1B8ED7DC4`

          압축 내용물을 Wizardry 8 게임 폴더에 덮어씁니다. 설치 전 게임 폴더와 세이브를 백업하세요.
          EOF

          cat > notes-128.md <<'EOF'
          # Wizardry 8 한국어 패치 v0.2.8 — Fan Patch 1.28

          Fan Patch **1.28 build 6735**용 저널 표기/글꼴 수정 릴리스입니다.

          ## 변경 내용

          - 저널에서 종족/고유명사 `Mook`가 `묵`으로 번역되던 16개 슬롯을 `Mook`로 통일했습니다.
          - `FACT.DBS`에서 Mook 관련 저널 필드만 변경했고, 저널 필드 외 데이터 변경은 0건입니다.
          - v0.2.7에서 갈무리9 교체 대상에서 빠져 있던 `Data/JOURNAL/journal_font.sti`를 수정했습니다.
          - 저널 한글 1,196개 글리프를 갈무리9 기반 픽셀 형태로 교체하고 라틴 문자 기준선에 맞춰 재배치했습니다.
          - 비한글 2,103개 글리프의 ETRLE 압축 데이터는 v0.2.7과 동일하게 유지했습니다.

          ## 검증

          - Mook 관련 저널 항목 전체에서 `묵` 잔존 0건
          - `FACT.DBS` 저널 필드 외 변경 0건
          - `journal_font.sti` 3,299개 프레임 전체 ETRLE 재해독 통과
          - 1.24 / 1.28의 수정 `FACT.DBS`, `journal_font.sti` 바이트 단위 동일 확인
          - ZIP CRC 및 SHA-256 검증 완료

          ## 다운로드

          `Wizardry8_KoreanPatch_1.28_JournalFix_v0.2.8.zip`

          SHA-256: `7D2A892DB90CE75E51C6B122A78DFBFDF4A2D55A70939E2DD9DD07C379DDF254`

          Fan Patch 1.28에서는 런처 언어를 **ENG**로 두고 `Wiz8_v128.exe`를 실행하세요.
          EOF

      - name: Publish 1.24 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='0.2.8(1.24)'
          asset='Wizardry8_KoreanPatch_1.24_JournalFix_v0.2.8.zip'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title 'Wizardry 8 (1.24) 한국어 패치 v0.2.8' --notes-file notes-124.md
          else
            gh release create "$tag" "$asset" --target main --title 'Wizardry 8 (1.24) 한국어 패치 v0.2.8' --notes-file notes-124.md
          fi

      - name: Publish 1.28 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.2.8'
          asset='Wizardry8_KoreanPatch_1.28_JournalFix_v0.2.8.zip'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title 'Wizardry 8 (1.28.6735) 한국어 패치 v0.2.8' --notes-file notes-128.md
          else
            gh release create "$tag" "$asset" --target main --title 'Wizardry 8 (1.28.6735) 한국어 패치 v0.2.8' --notes-file notes-128.md
          fi
